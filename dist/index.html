function retrieve(q, records) { const terms=tokens(q); if(!terms.length)return []; return records.map(r=>{const hay=[r.program,r.experiment,r.title,r.category,r.finding,r.materials].join(' ').toLowerCase();return {r,score:terms.filter(t=>hay.includes(t)).length};}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,3).map(x=>x.r); }

function chart(records,key){const groups={};records.forEach(r=>groups[r[key]]=(groups[r[key]]||0)+1);const max=Math.max(...Object.values(groups),1);return Object.entries(groups).map(([name,n])=>`<div class="bar-row"><button class="btn small" data-chart="${e(key)}" data-value="${e(name)}">${e(name)}</button><div class="track" role="img" aria-label="${e(name)}: ${n} records"><div class="bar" style="width:${n/max*100}%"></div></div><span class="mini">${n}</span></div>`).join('');}
function coverage(){return `<div class="coverage"><span>Record / parameter</span><abbr title="Oxygen concentration">O₂</abbr><abbr title="Pressure">P</abbr><abbr title="Airflow">Flow</abbr><abbr title="Extinction threshold">Ext.</abbr></div>${RECORDS.map(r=>`<div class="coverage"><span>${e(r.id)}</span>${Core.fields.map(f=>`<span class="cell ${Number.isFinite(r[f])?'yes':''}" title="${e(r.id+' '+f)}: ${r[f]??'not extracted'}" aria-label="${e(r.id+' '+f)}: ${r[f]??'not extracted'}"></span>`).join('')}</div>`).join('')}<p class="mini">Outlined = not extracted. This is catalog completeness, not absence of NASA data.</p>`;}
function command(){return heading('Spacefire research & intelligence','A clearer view of fire in space.','Explore the evidence. Understand the limits. Connect research to future missions.',`<button class="btn" data-action="export">↓ Export catalog</button>`)+`<section class="hero"><div class="hero-copy"><div class="eyebrow">KNOWLEDGE FOR THE NEXT FRONTIER</div><h2>From microgravity experiments<br>to better research questions.</h2><p>A traceable workspace for NASA combustion research, built around sources—not unsupported predictions.</p><button class="btn primary" data-page="explorer">Explore the evidence <span>↗</span></button></div><div class="orbit" aria-label="Decorative orbital illustration"><div class="orb"></div><span class="orbit-label">CONCEPTUAL VISUAL · NOT EXPERIMENTAL DATA</span></div></section><section class="stats">${[[RECORDS.filter(r=>r.status==='Source checked').length,'Source-checked records','1 additional catalog-checked record'],[new Set(RECORDS.map(r=>r.program)).size,'Research programs','BASS / Saffire / FLEX / ACME / SAME'],[new Set(RECORDS.map(r=>r.url)).size,'Unique source documents','Articles, overview, catalog, presentation'],[new Set(RECORDS.map(r=>r.experiment)).size,'Indexed investigations','Curated starter coverage']].map(([n,t,d])=>`<div class="stat"><label>${t}</label><strong>${String(n).padStart(2,'0')}</strong><small>${d}</small></div>`).join('')}</section><section class="grid2"><div class="panel"><div class="panel-title"><h2>Research landscape</h2><span class="mini">RECORD COUNT</span></div>${chart(RECORDS,'program')}<p class="mini">Click a program to open its evidence.</p></div><div class="panel"><div class="panel-title"><h2>Know what’s missing</h2><span class="badge amber">DATA GAPS</span></div>${coverage()}</div></section><section class="section"><div class="panel-title"><h2>Start with the evidence</h2><button class="btn small" data-page="explorer">View all ${RECORDS.length} records →</button></div><div class="grid3">${['FLEX-01','SAFFIRE-06','BASS-02'].map(id=>card(RECORDS.find(r=>r.id===id))).join('')}</div></section>`+note('Research prototype · No connected language model. Source-checked means the cited text was reviewed, not that the study was independently replicated or peer reviewed by this project.');}
function options(key){return [...new Set(RECORDS.map(r=>r[key]))].map(x=>`<option>${e(x)}</option>`).join('');}
function explorer(){return heading('NASA research explorer','Follow the source.','Search a curated catalog of findings, study objectives and documented limitations.',`<button class="btn" data-page="about">＋ Add a research draft</button>`)+`<div class="filters"><label>Search research<input id="query" placeholder="Try cool flames, PMMA or BASS…" type="search"></label><label>Program<select id="program"><option value="">All programs</option>${options('program')}</select></label><label>Fuel class<select id="fuel"><option value="">All fuels</option>${options('fuel')}</select></label><label>Environment<select id="environment"><option value="">All environments</option>${options('environment')}</select></label></div><div class="row"><p id="result-count" aria-live="polite"></p><button class="btn small" data-action="clear">Reset filters</button></div><div class="grid3" id="results"></div>`;}
function updateResults(){const rows=Core.filter(RECORDS,...['query','program','fuel','environment'].map(id=>document.getElementById(id).value));document.querySelector('#result-count').textContent=`${rows.length} of ${RECORDS.length} records · curated sources, not a live NASA search`;document.querySelector('#results').innerHTML=rows.length?rows.map(card).join(''):'<div class="empty">No matching research. Try a broader term or reset filters.</div>';}
function compare(){const selected=RECORDS.filter(r=>chosen.has(r.id));const rows=[['Investigation','experiment'],['Fuel / material','materials'],['Environment','environment'],['Atmosphere','atmosphere'],['Oxygen concentration (%)','oxygen'],['Pressure (kPa)','pressure'],['Airflow (cm/s)','airflow'],['Extinction threshold','extinction'],['Experimental context','conditions'],['Evidence scope','scope'],['Reported finding / objective','finding'],['Limits','limitations']];return heading('Experiment comparison','Compare context before conclusions.','Select up to three investigations. Shared categories do not imply matched experimental conditions.')+`<div class="compare-pick">${RECORDS.map(r=>`<label class="check"><input type="checkbox" data-compare="${r.id}" ${chosen.has(r.id)?'checked':''}>${e(r.id)}</label>`).join('')}</div>`+note('Quantitative comparison unavailable: this starter catalog has no matched, run-level measurements. Missing values are never plotted as zero.')+(selected.length?`<div class="table-wrap"><table><caption class="sr-only">Selected investigation evidence comparison</caption><thead><tr><th>Research parameter</th>${selected.map(r=>`<th>${e(r.id)}<br>${source(r)}</th>`).join('')}</tr></thead><tbody>${rows.map(([label,key])=>`<tr><th scope="row">${label}</th>${selected.map(r=>`<td>${unknown(r[key])}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="panel"><h2>Extracted numeric parameter coverage</h2>${selected.map(r=>`<div class="bar-row"><span>${e(r.id)}</span><div class="track"></div><span>0/4</span></div>`).join('')}<p class="mini">Counts of populated fields in this catalog, not measured flame properties.</p></div>`:'<div class="empty">Select an investigation to begin comparing.</div>');}
function intelligence(){return heading('AI research intelligence · prototype','Ask a question. Inspect the evidence.','Local keyword retrieval returns curated evidence cards. No generative model, external API or live NASA data connection is active.')+`<div class="panel section"><span class="badge amber">RETRIEVAL DEMO · NO LLM</span><form id="ask-form" class="qa-form"><label class="sr-only" for="question">Research question</label><input id="question" maxlength="500" required placeholder="What did FLEX reveal about visible flame extinction?"><button class="btn primary" type="submit">Retrieve evidence ↗</button></form><div class="chips">${['What did Saffire study?','Which studies examined extinction?','What is known about smoke?','How does lunar gravity affect flames?'].map(q=>`<button class="btn small" data-question="${e(q)}">${q}</button>`).join('')}</div></div><div id="answer" class="answer" aria-live="polite"><div class="empty">Your evidence trail starts with a question.</div></div>`;}
function ask(q){const hits=Core.retrieve(q,RECORDS);document.querySelector('#question').value=q;document.querySelector('#answer').innerHTML=`<div class="panel"><h2>Evidence retrieved for your question</h2><p>${e(q)}</p>${note('These are matching records, not a generated answer. A lexical match does not prove that a study answers the question. Lunar or Martian gravity conclusions cannot be derived from this catalog.')}<p>${hits.length?`${hits.length} relevant candidate records`:'No supporting evidence found in this curated catalog. Try an experiment name or broader topic.'}</p>${hits.map((r,i)=>`<article class="panel"><div class="row"><h3>[${i+1}] ${e(r.title)}</h3>${badge(r)}</div><strong>Source-reported ${r.scope==='Research objective'?'objective':'evidence'}</strong><p>${e(r.finding)}</p><blockquote class="quote">“${e(r.quote)}”</blockquote><strong>Project interpretation</strong><p>${e(r.interpretation)}</p><strong>Limits</strong><p>${e(r.limitations)}</p><p>[${i+1}] ${source(r)} · ${e(r.reference)}</p></article>`).join('')}</div>`;}
function safety(){const ranked=[...RECORDS].sort((a,b)=>Core.priority(b).score-Core.priority(a).score);return heading('Fire safety intelligence','Prioritize what to investigate next.','An explainable reading order based on relevance and traceability—not an estimate of fire probability or severity.')+note('Editorial research-priority score / 5. Not a validated risk model, material certification, mission approval or safety instruction.')+`<details class="panel section"><summary>Inspect the ranking methodology</summary><p>Score = stated spacecraft relevance (0–2) + source traceability (0–2) + extracted technical-document detail (0–1).</p><ul class="about-list"><li>Relevance: 2 = explicit fire-safety link; 1 = indirect combustion relevance; 0 = no stated link.</li><li>Traceability: 2 = directly readable NASA source checked; 1 = indexed official catalog metadata only; 0 = unverified.</li><li>Detail: 1 = technical presentation abstract; 0 = overview or catalog. This is not a peer-review quality grade.</li><li>Ties retain catalog order. Unverified local drafts are excluded. Severity is not scored without defensible hazard data.</li></ul></details><div class="section">${ranked.map((r,i)=>{const s=Core.priority(r);return `<article class="panel" style="margin-bottom:12px"><div class="row"><div><div class="eyebrow">${String(i+1).padStart(2,'0')} / ${e(r.program)}</div><h3>${e(r.title)}</h3></div><div class="score">${s.score}<span class="mini"> / 5</span></div></div><p>${e(r.interpretation)}</p><p class="mini">Relevance ${s.relevance}/2 + traceability ${s.traceability}/2 + technical detail ${s.detail}/1</p><button class="btn small" data-record="${r.id}">Inspect basis & limitations ↗</button></article>`;}).join('')}</div>`;}
const missions={'ISS operations':{ids:['BASS-01','FLEX-01','SAME-R'],text:'Review how ventilation, extinction and smoke transport are represented in ISS research. These sources do not prescribe operational response procedures.'},'Future spacecraft':{ids:['SAFFIRE-06','BASS-02'],text:'Investigate how material fire behavior connects to cabin temperature and combustion products. Vehicle geometry and ventilation require mission-specific validation.'},'Lunar habitats':{ids:['ACME-BRE','BASS-02'],text:'Use these studies to formulate partial-gravity flammability questions. ISS microgravity is not lunar gravity; this catalog cannot establish lunar material limits.'},'Moon exploration':{ids:['ACME-BRE','SAFFIRE-06'],text:'Plan research on material selection and cabin fire consequences. No lunar surface tests or suit oxygen conditions are included in this prototype.'},'Mars transit':{ids:['SAFFIRE-06','SAME-R','FLEX-01'],text:'Review detection and post-extinction research for long-duration transit questions. Do not infer safe operating limits from these summaries.'},'Martian habitats':{ids:['ACME-BRE','BASS-01'],text:'Identify gaps in partial-gravity combustion evidence. Neither the Martian external atmosphere nor a specified habitat atmosphere is represented here.'}};
function missionPage(){const m=missions[mission];return heading('Mission applications','Connect evidence. Mark the leap.','Explore potential research applications while keeping tested conditions separate from future environments.')+`<div class="mission-tabs">${Object.keys(missions).map(x=>`<button class="btn" data-mission="${e(x)}" aria-pressed="${x===mission}">${e(x)}</button>`).join('')}</div><div class="panel"><span class="badge amber">PROPOSED APPLICATION · PROJECT INTERPRETATION</span><h2 style="margin-top:14px">${e(mission)}</h2><p>${e(m.text)}</p></div><h2 class="section">Relevant source records</h2><div class="grid3">${m.ids.map(id=>card(RECORDS.find(r=>r.id===id))).join('')}</div>`;}
function lab(){return heading('Research visualization lab','See the shape of the evidence.','Interactive catalog views. All counts come from source records; no simulated measurements are presented as NASA data.')+`<div class="grid-even section"><div class="panel"><h2>Fuel-class coverage</h2>${chart(RECORDS,'fuel')}</div><div class="panel"><h2>Numeric parameter completeness</h2>${coverage()}</div><div class="panel"><h2>Document metadata timeline</h2><p class="mini">Dates below are labeled by type—not experiment dates.</p><div class="timeline">${RECORDS.filter(r=>r.date).sort((a,b)=>a.date.localeCompare(b.date)).map(r=>`<article><span class="eyebrow">${r.date}</span><h3>${e(r.id)}</h3><p>${e(r.dateKind)}</p><button class="btn small" data-record="${r.id}">Open record</button></article>`).join('')}</div><p class="mini">${RECORDS.filter(r=>!r.date).length} records have no established publication date.</p></div><div class="panel"><h2>Flame behavior & research scope</h2>${RECORDS.map(r=>`<div class="list-item"><span class="record-code">${e(r.id)}</span><div><strong>${e(r.category)}</strong><p>${e(r.scope)}</p></div></div>`).join('')}</div></div>`;}
function about(){return heading('About THE ORIGIN','Scientific responsibility is a feature.','An independent NASA Space Apps research prototype. Not affiliated with or endorsed by NASA.')+`<div class="grid-even section"><div class="panel"><h2>What this version does</h2><p>Seven curated records from five NASA source documents. Search, comparison, evidence retrieval, transparent priority scoring, mission interpretations and catalog charts run entirely in your browser.</p><h3 class="section">What it does not do</h3><p>No live ingestion, connected LLM, raw experiment processing, calibrated risk prediction or quantitative comparison. No API key is required or collected.</p><h3 class="section">Challenge review</h3><p>The official indexed listing calls for an interactive dashboard that summarizes, ranks and interprets combustion findings. Full challenge-page retrieval failed; detailed resources, eligibility, submission rules and deadline still need confirmation.</p><a href="https://www.spaceappschallenge.org/2026/challenges/flame-in-freefall/" target="_blank" rel="noopener noreferrer">Official challenge ↗</a><h3 class="section">Source standard</h3><p>Checked 14 November 2026. “Source checked” indicates readable official text reviewed. “Catalog checked” indicates indexed official metadata only. Original results, research objectives and project interpretations are separately labeled.</p><p>SAME means Smoke Aerosol Measurement Experiment. All numeric conditions remain null until run-level extraction and compatibility review.</p><button class="btn section" data-action="export">↓ Export curated catalog JSON</button></div><div class="panel"><h2>Add a research draft</h2><p>Paste a JSON object with title, program, url and summary. Drafts stay unverified and are excluded from scientific counts, rankings and answers.</p><label for="draft">Research draft JSON</label><textarea id="draft" spellcheck="false" placeholder='{"title":"Study title","program":"BASS","url":"https://ntrs.nasa.gov/...","summary":"What the source says"}'></textarea><button class="btn primary" data-action="add-draft">Save unverified draft</button><p id="draft-status" role="status"></p><p class="mini">Stored only in this browser when available. Export to keep a backup. Nothing is uploaded.</p><div class="row"><h3>Review queue (${drafts.length})</h3><button class="btn small" data-action="export-drafts">Export drafts</button></div><div id="drafts">${drafts.map(d=>`<article class="list-item"><div><span class="badge amber">UNVERIFIED</span><h3>${e(d.title)}</h3><p>${e(d.summary)}</p><a href="${e(d.url)}" target="_blank" rel="noopener noreferrer">Submitted source ↗</a></div></article>`).join('')||'<p>No drafts yet.</p>'}</div></div></div><div class="panel section"><h2>Architecture & next milestones</h2><p>Buildless HTML/CSS/JavaScript → curated evidence records → local filters and keyword retrieval → cited views. Authoring files are separated; the build produces a single portable HTML file.</p><ol class="about-list"><li>Confirm complete challenge resources and submission requirements.</li><li>Extract run-level measurements with units and provenance from primary papers and PSI datasets.</li><li>Introduce compatibility checks before enabling numerical cross-study plots.</li><li>Add server-side, evidence-grounded generation only if an API is explicitly configured.</li><li>Conduct researcher review and cross-device QA before submission.</li></ol><p>AI assistance: OpenAI ChatGPT assisted source review, coding, interface design and documentation. Curated summaries need human scientific review.</p><a href="https://github.com/tanishkyadav09-hash/the-origin" target="_blank" rel="noopener noreferrer">Project repository ↗</a></div>`;}
function render(page=active){active=pages.some(p=>p[0]===page)?page:'command';nav.innerHTML=pages.map(([id,icon,label])=>`<button data-page="${id}" class="${active===id?'active':''}" ${active===id?'aria-current="page"':''}><span class="nav-icon" aria-hidden="true">${icon}</span>${label}</button>`).join('');document.querySelector('#crumb').textContent=pages.find(p=>p[0]===active)[2];main.innerHTML=({command,explorer,compare,intelligence,safety,missions:missionPage,lab,about})[active]()+`<footer class="footnote">THE ORIGIN / EVIDENCE BEFORE INFERENCE <span style="float:right">PROTOTYPE 0.1</span></footer>`;if(active==='explorer')updateResults();if(active==='about'&&!storageOK)document.querySelector('#draft-status').textContent='Browser storage unavailable or invalid. New drafts stay in memory; export them before closing.';history.replaceState(null,'','#'+active);}
function detail(id){const r=RECORDS.find(x=>x.id===id);if(!r)return;const d=document.querySelector('#detail');d.innerHTML=`<div class="row"><div><div class="eyebrow">${e(r.id)} / ${e(r.scope)}</div><h2 id="detail-title">${e(r.title)}</h2></div><button class="btn small" data-action="close">Close ×</button></div>${badge(r)}<div class="detail-grid">${[['Investigation',r.experiment],['Document type',r.type],['Fuel',r.materials],['Environment',r.environment],['Date',r.date??'Not established'],['Date meaning',r.dateKind]].map(([k,v])=>`<div><span>${k}</span>${e(v)}</div>`).join('')}</div><h3>Source-reported evidence / objective</h3><p>${e(r.finding)}</p><blockquote class="quote">“${e(r.quote)}”</blockquote><p class="mini">${e(r.reference)}</p><h3>Project interpretation</h3><p>${e(r.interpretation)}</p><h3>Limitations & uncertainty</h3><p>${e(r.limitations)}</p><h3>Experimental context</h3><p>${e(r.conditions)} ${e(r.atmosphere)}</p>${note('Oxygen, pressure, airflow and extinction thresholds are not extracted. No numerical safety claim is supported.')}<p>${e(r.publication)} · ${source(r)}</p>`;d.showModal();}
function download(data,name){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Export prepared.');}
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.page){render(b.dataset.page);main.focus();return;}if(b.dataset.record)return detail(b.dataset.record);if(b.dataset.select){if(chosen.has(b.dataset.select))chosen.delete(b.dataset.select);else if(chosen.size<3)chosen.add(b.dataset.select);else return toast('Choose at most three investigations. Remove one in Comparison first.');b.textContent=chosen.has(b.dataset.select)?'✓ Selected':'＋ Compare';return;}if(b.dataset.question)return ask(b.dataset.question);if(b.dataset.mission){mission=b.dataset.mission;return render();}if(b.dataset.chart){const key=b.dataset.chart,val=b.dataset.value;render('explorer');document.getElementById(key).value=val;return updateResults();}switch(b.dataset.action){case 'close':document.querySelector('#detail').close();break;case 'export':download({version:'0.1',checked:'2026-11-14',records:RECORDS},'the-origin-catalog.json');break;case 'export-drafts':download(drafts,'the-origin-unverified-drafts.json');break;case 'clear':render('explorer');break;case 'add-draft':try{const d=Core.validateDraft(JSON.parse(document.querySelector('#draft').value));drafts.push(d);try{localStorage.setItem(draftKey,JSON.stringify(drafts));storageOK=true;}catch{storageOK=false;}render('about');document.querySelector('#draft-status').textContent=storageOK?'Saved as an unverified draft.':'Saved in memory only. Export drafts before closing.';}catch(err){document.querySelector('#draft-status').textContent='Could not save: '+err.message;}break;}});
document.addEventListener('input',ev=>{if(['query','program','fuel','environment'].includes(ev.target.id))updateResults();});
document.addEventListener('change',ev=>{if(ev.target.dataset.compare){const id=ev.target.dataset.compare;if(ev.target.checked&&chosen.size>=3){ev.target.checked=false;return toast('Select up to three investigations.');}ev.target.checked?chosen.add(id):chosen.delete(id);render('compare');}});
document.addEventListener('submit',ev=>{if(ev.target.id==='ask-form'){ev.preventDefault();const q=document.querySelector('#question').value.trim();if(q)ask(q);else toast('Enter a research question.');}});
render(location.hash.slice(1)||'command');
</script></body></html>
